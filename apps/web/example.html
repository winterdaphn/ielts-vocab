// --- Words ---
function renderWords() {
  const filter = state.wordsFilter;
  const filtered = state.words.filter(w => {
    if (filter === 'all') return !w.crossedOut;
    if (filter === 'crossed') return w.crossedOut;
    return getWordStatus(w) === filter;
  }).sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

  const counts = {
    all: state.words.filter(w => !w.crossedOut).length,
    new: state.words.filter(w => !w.crossedOut && (w.totalReviews || 0) === 0).length,
    due: state.words.filter(w => !w.crossedOut && (w.nextReview ?? 0) <= Date.now() && (w.totalReviews || 0) > 0).length,
    learning: state.words.filter(w => !w.crossedOut && (w.totalReviews || 0) > 0 && (w.interval ?? 0) < 21).length,
    mastered: state.words.filter(w => !w.crossedOut && (w.interval ?? 0) >= 21 && (w.streak ?? 0) >= 3).length,
    crossed: state.words.filter(w => w.crossedOut).length,
  };

  const missingGloss = state.words.filter(w => !w.crossedOut && !hasValidTranslation(w)).length;
  const badPhonetic = state.words.filter(w => !w.crossedOut && isBadPhonetic(w.phonetic)).length;

  return `
    <div class="app-header">
      <h1>词表</h1>
      <p>共 ${state.words.length} 个单词 · 单词 · 音标 · 发音 · 词语释义</p>
    </div>

    ${(missingGloss > 0 || badPhonetic > 0) ? `
      <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div style="font-size:13px; color:var(--text-light);">
          ${missingGloss > 0 ? `缺释义 <b style="color:var(--accent);">${missingGloss}</b>` : ''}
          ${missingGloss > 0 && badPhonetic > 0 ? ' · ' : ''}
          ${badPhonetic > 0 ? `音标需修正 <b style="color:var(--accent);">${badPhonetic}</b>` : ''}
        </div>
        <button class="btn btn-primary btn-sm" id="backfill-gloss" ${_glossBackfillRunning ? 'disabled' : ''}>
          ${_glossBackfillRunning ? '修正中…' : '一键修正释义/音标'}
        </button>
      </div>
    ` : ''}

    <div class="filter-tabs">
      <button class="filter-tab ${filter === 'all' ? 'active' : ''}" data-filter="all">全部 (${counts.all})</button>
      <button class="filter-tab ${filter === 'new' ? 'active' : ''}" data-filter="new">新词 (${counts.new})</button>
      <button class="filter-tab ${filter === 'due' ? 'active' : ''}" data-filter="due">待复习 (${counts.due})</button>
      <button class="filter-tab ${filter === 'learning' ? 'active' : ''}" data-filter="learning">学习中 (${counts.learning})</button>
      <button class="filter-tab ${filter === 'mastered' ? 'active' : ''}" data-filter="mastered">已掌握 (${counts.mastered})</button>
      <button class="filter-tab ${filter === 'crossed' ? 'active' : ''}" data-filter="crossed">已划掉 (${counts.crossed})</button>
    </div>

    ${filtered.length === 0 ? `
      <div class="card empty">
        <div class="empty-icon">📭</div>
        <h3>这里空空如也</h3>
        <p>${filter === 'all' ? '去「添加」加几个新词吧' : '切换其他分类看看'}</p>
      </div>
    ` : filtered.map(w => {
      const status = getWordStatus(w);
      const tagMap = { new: '<span class="tag tag-new">新词</span>', due: '<span class="tag tag-due">待复习</span>', learning: '<span class="tag tag-due">学习中</span>', mastered: '<span class="tag tag-mastered">已掌握</span>', crossed: '<span class="tag tag-crossed">已划掉</span>' };
      const isCrossed = status === 'crossed';
      const translation = getWordTranslation(w);
      return `
        <div class="word-list-item ${isCrossed ? 'crossed' : ''}">
          <div class="word-main">
            <div class="word-row">
              <span class="word">${escapeHtml(w.word)}</span>
              ${renderPhoneticWithSpeakers(w)}
            </div>
            <div class="translation ${translation ? '' : 'mute'}">${escapeHtml(translation || '暂无翻译')}</div>
          </div>
          <div class="meta">
            <div class="tags">${tagMap[status] || ''}</div>
            <div class="actions">
              <button class="view-btn" data-id="${w.id}" title="查看详情">👁</button>
              ${isCrossed
                ? `<button class="restore-btn" data-id="${w.id}" title="恢复">↩</button>
                   <button class="delete" data-id="${w.id}" title="删除">✕</button>`
                : `<button class="cross-btn" data-id="${w.id}" title="划掉">−</button>`}
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

      ${statusText} · 已复习 ${w.totalReviews || 0} 次 · 正确率 ${w.totalReviews ? Math.round((w.correctReviews || 0) / w.totalReviews * 100) : 0}% · ${formatRelative(w.nextReview) || '未复习'}

      <button class="btn" id="close-modal">关闭</button>
      <button class="btn" id="practice-cloze">完形填空</button>
      <button class="btn btn-primary" id="practice-translate">句子翻译</button>
    </div>
  `;

  showModal(content);

  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('practice-cloze').addEventListener('click', () => {
    closeModal();
    startPractice([w], 'cloze');
  });
  document.getElementById('practice-translate').addEventListener('click', () => {
    closeModal();
    startPractice([w], 'translate');
  });

  bindAccentSpeakButtons(document.getElementById('modal-content'));

  if (!w.mnemonic && isConfigured()) {
    ensureMnemonic(w).then(tip => {
      const slot = document.getElementById('detail-mnemonic');
      if (slot) slot.innerHTML = mnemonicHtml(tip);
    }).catch(() => {
      const slot = document.getElementById('detail-mnemonic');
      if (slot) slot.innerHTML = '';
    });
  }
}

async function handleGenerate() {
  if (!isConfigured()) {
    toast('请先在设置里配置 API', 'error');
    state.view = 'settings';
    render();
    return;
  }
  const word = state.addWord.word.trim().toLowerCase();
  if (!word) {
    toast('请输入单词');
    return;
  }
  const related = findRelatedWordInList(word);
  if (related) {
    if (related.exact) {
      if (!confirm(`「${related.entry.word}」已在词表里，要重新查词吗？`)) return;
    } else {
      toast(`词表已有「${related.entry.word}」，「${word}」是其词形变化，无需重复添加`, 'error');
      return;
    }
  }

  state.addWord.generating = true;
  render();

  try {
    const result = await generateWordInfo(word);
    state.addWord.phonetic = result.phonetic || '';
    state.addWord.partOfSpeech = result.partOfSpeech || '';
    state.addWord.translation = result.translation || '';
    state.addWord.mnemonic = result.mnemonic || '';
    if (!state.addWord.translation) {
      toast('AI 没有生成翻译，再试一次？', 'error');
    }
  } catch (e) {
    console.error(e);
    toast('生成失败：' + e.message, 'error');
  } finally {
    state.addWord.generating = false;
    render();
  }
}

async function handleSave() {
  const word = state.addWord.word.trim().toLowerCase();
  if (!word || !state.addWord.translation) {
    toast('先生成翻译再保存');
    return;
  }

  const related = findRelatedWordInList(word, { includeCrossed: true });
  if (related && !related.exact) {
    toast(`词表已有「${related.entry.word}」，「${word}」是词形变化，已跳过`, 'error');
    return;
  }

  const existing = related?.exact ? related.entry : state.words.find(w => w.word.toLowerCase() === word);
  if (existing) {
    existing.translation = state.addWord.translation;
    existing.phonetic = state.addWord.phonetic;
    existing.partOfSpeech = state.addWord.partOfSpeech;
    if (state.addWord.mnemonic) existing.mnemonic = state.addWord.mnemonic;
    existing.crossedOut = false;
    if (existing.interval === undefined) {
      existing.interval = 0;
      existing.streak = 0;
      existing.ease = 2.5;
      existing.nextReview = Date.now();
    }
    await dbPut(existing);
  } else {
    const w = {
      id: crypto.randomUUID(),
      word,
      phonetic: state.addWord.phonetic,
      partOfSpeech: state.addWord.partOfSpeech,
      translation: state.addWord.translation,
      mnemonic: state.addWord.mnemonic || '',
      examples: [],
      addedAt: Date.now(),
      crossedOut: false,
      ease: 2.5,
      interval: 0,
      streak: 0,
      nextReview: Date.now(),
      lastReviewed: null,
      totalReviews: 0,
      correctReviews: 0
    };
    await dbPut(w);
    state.words.push(w);
  }

  state.addWord = { word: '', translation: '', generating: false, phonetic: '', partOfSpeech: '', mnemonic: '' };
  render();
  toast(`已保存「${word}」`, 'success');
}

async function importWordsFromJSON(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    toast('JSON 解析失败：' + e.message, 'error');
    throw e;
  }
  if (!data.words || !Array.isArray(data.words)) {
    toast('文件格式不对，找不到 words 数组', 'error');
    throw new Error('格式不对');
  }
  if (data.words.length === 0) {
    toast('文件里没有单词', 'error');
    return;
  }

  // Generate UUID helper with fallback
  const newId = () => {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  };

  let added = 0, skipped = 0;
  for (const w of data.words) {
    if (!w.word) { skipped++; continue; }
    if (!w.id) w.id = newId();
    const related = findRelatedWordInList(w.word, { includeCrossed: true });
    if (related || state.words.find(x => x.id === w.id)) {
      skipped++;
      continue;
    }
    // Ensure all required fields
    if (!w.examples) w.examples = [];
    if (w.crossedOut === undefined) w.crossedOut = false;
    if (w.ease === undefined) w.ease = 2.5;
    if (w.interval === undefined) w.interval = 0;
    if (w.streak === undefined) w.streak = 0;
    if (w.nextReview === undefined) w.nextReview = Date.now();
    if (w.totalReviews === undefined) w.totalReviews = 0;
    if (w.correctReviews === undefined) w.correctReviews = 0;
    await dbPut(w);
    state.words.push(w);
    added++;
  }
  if (added > 0) {
    toast(`已导入 ${added} 个单词${skipped > 0 ? `（${skipped} 个重复已跳过）` : ''}`, 'success');
  } else if (skipped > 0) {
    toast('这些单词已经在词表里了', 'error');
  }
  render();
}

}

// ============= CLOUD SYNC =============
async function getSyncPayload() {
  // Gather all data to sync (per-profile)
  const words = state.words.map(w => ({ ...w }));
  const stateObj = {
    streak: localStorage.getItem(lsKey('streak')) || '0',
    lastDay: localStorage.getItem(lsKey('last-day')) || ''
  };
  // Also gather today's done flag (could be a few keys)
  const todayDone = {};
  const donePrefix = lsKey('done-');
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(donePrefix)) {
      todayDone[k] = localStorage.getItem(k);
    }
  }

  // Gather SENSITIVE data to encrypt: API key, sync token, current practice session
  const sensitive = {
    apiKey: state.settings.apiKey || '',
    syncToken: state.settings.syncToken || '',
    provider: state.settings.provider || 'openai',
    apiBase: state.settings.apiBase || '',
    model: state.settings.model || '',
    session: serializePracticeSession(state.session)
  };

  // Encrypt if a password is set
  const pwd = getSyncPassword();
  const encrypted = pwd ? await encryptForSync(sensitive, pwd) : null;

  return { words, state: { ...stateObj, todayDone }, encrypted };
}

async function applySyncPayload(data) {
  if (!data || typeof data !== 'object') return { added: 0, replaced: false, needsPassword: false };
  let added = 0;
  let decrypted = null;

  // First, try to decrypt the encrypted payload
  if (data.encrypted) {
    const pwd = getSyncPassword();
    if (pwd) {
      decrypted = await decryptForSync(data.encrypted, pwd);
    }
    if (!decrypted) {
      // Need to prompt for password
      return { added: 0, replaced: false, needsPassword: true, encrypted: data.encrypted };
    }
  }

  if (Array.isArray(data.words)) {
    // Clear existing and replace
    await dbClear();
    state.words = [];
    for (const w of data.words) {
      if (!w || !w.word) continue;
      if (!w.id) w.id = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + Math.random();
      // normalize fields
      if (!w.examples) w.examples = [];
      if (w.crossedOut === undefined) w.crossedOut = false;
      if (w.ease === undefined) w.ease = 2.5;
      if (w.interval === undefined) w.interval = 0;
      if (w.streak === undefined) w.streak = 0;
      if (w.nextReview === undefined) w.nextReview = Date.now();
      if (w.totalReviews === undefined) w.totalReviews = 0;
      if (w.correctReviews === undefined) w.correctReviews = 0;
      await dbPut(w);
      state.words.push(w);
      added++;
    }
  }
  if (data.state) {
    if (data.state.streak !== undefined) localStorage.setItem(lsKey('streak'), String(data.state.streak));
    if (data.state.lastDay !== undefined) localStorage.setItem(lsKey('last-day'), data.state.lastDay);
    if (data.state.todayDone && typeof data.state.todayDone === 'object') {
      for (const [k, v] of Object.entries(data.state.todayDone)) {
        localStorage.setItem(k, v);
      }
    }
  }
  // Apply decrypted sensitive data
  if (decrypted) {
    if (decrypted.apiKey) state.settings.apiKey = decrypted.apiKey;
    if (decrypted.syncToken !== undefined) state.settings.syncToken = decrypted.syncToken;
    if (decrypted.apiBase) state.settings.apiBase = decrypted.apiBase;
    if (decrypted.model) state.settings.model = decrypted.model;
    if (decrypted.provider) state.settings.provider = decrypted.provider;
    saveSettings();
    if (decrypted.session) {
      try { localStorage.setItem(PRACTICE_SESSION_KEY, JSON.stringify(decrypted.session)); } catch {}
    }
  }
  return { added, replaced: true, decrypted: !!decrypted };
}

function syncHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  if (state.settings.syncToken) headers['X-Auth-Token'] = state.settings.syncToken;
  if (state.authUsername) headers['X-Profile'] = state.authUsername;
  return headers;
}

async function pushToCloud() {
  const url = (state.settings.workerUrl || '').trim();
  if (!url) {
    toast('请先在设置中填 Worker URL', 'error');
    return;
  }
  // Prompt for sync password on first push (if API key is set, we want to encrypt it)
  if (state.settings.apiKey && !getSyncPassword()) {
    const pwd = await promptForPassword('设个同步密码（用于加密 API key 和练习进度）\n这台设备记住密码，其他设备需要输入同样的密码才能解密', '');
    if (!pwd) { toast('已取消推送'); return; }
    setSyncPassword(pwd);
  }
  const btn = document.getElementById('sync-push');
  if (btn) { btn.disabled = true; btn.textContent = '推送中…'; }
  try {
    const payload = await getSyncPayload();
    const resp = await fetch(url.replace(/\/$/, '') + '/api/all', {
      method: 'POST',
      headers: syncHeaders(),
      body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 100)}`);
    }
    state.settings.lastSyncAt = Date.now();
    saveSettings();
    const statusEl = document.getElementById('sync-status');
    if (statusEl) statusEl.textContent = `上次同步：${new Date().toLocaleString('zh-CN')}`;
    const encMsg = payload.encrypted ? '（API key 和 session 已加密）' : '（未设置同步密码，API key 未加密）';
    toast(`已推送 ${payload.words.length} 个单词到云端 ${encMsg}`, 'success');
  } catch (e) {
    console.error(e);
    toast('推送失败：' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📤 推送到云端'; }
  }
}

async function pullFromCloud() {
  const url = (state.settings.workerUrl || '').trim();
  if (!url) {
    toast('请先在设置中填 Worker URL', 'error');
    return;
  }
  if (!confirm('从云端拉取会覆盖本地所有数据，确定吗？\n（建议先导出本地数据做备份）')) return;
  const btn = document.getElementById('sync-pull');
  if (btn) { btn.disabled = true; btn.textContent = '拉取中…'; }
  try {
    const resp = await fetch(url.replace(/\/$/, '') + '/api/all', {
      method: 'GET',
      headers: syncHeaders()
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 100)}`);
    }
    const data = await resp.json();
    // If cloud has encrypted data and we don't have a password (or it's wrong), prompt
    if (data.encrypted) {
      const pwd = getSyncPassword();
      if (!pwd || !(await decryptForSync(data.encrypted, pwd))) {
        // Try once with current password
        if (pwd) toast('云端密码与你本地的不同', 'error');
        const choice = await new Promise((resolve) => {
          showModal(`
            <h2>需要同步密码</h2>
            <p>云端数据已加密，请输入密码以解密。</p>
            <div class="form-row">
              <input type="password" id="pull-pw-input" placeholder="同步密码" autocomplete="off" style="font-size: 16px;">
            </div>
            <p class="text-light mt-2" style="font-size: 12px;">忘了密码？点下面“忘了/重置”。</p>
            <div class="flex-row mt-3" style="justify-content: flex-end; gap: 8px;">
              <button class="btn" id="pull-cancel">取消</button>
              <button class="btn btn-danger" id="pull-forgot">忘了/重置</button>
              <button class="btn btn-primary" id="pull-ok">确定</button>
            </div>
          `);
          setTimeout(() => document.getElementById('pull-pw-input')?.focus(), 50);
          document.getElementById('pull-cancel').addEventListener('click', () => { closeModal(); resolve({ type: 'cancel' }); });
          document.getElementById('pull-forgot').addEventListener('click', () => { closeModal(); resolve({ type: 'forgot' }); });
          document.getElementById('pull-ok').addEventListener('click', () => {
            const v = (document.getElementById('pull-pw-input').value || '').trim();
            resolve({ type: 'ok', pwd: v });
          });
          document.getElementById('pull-pw-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const v = (document.getElementById('pull-pw-input').value || '').trim();
              resolve({ type: 'ok', pwd: v });
            }
          });
        });
        if (choice.type === 'cancel') { toast('已取消'); return; }
        if (choice.type === 'forgot') {
          if (confirm('重置密码后，本次拉取会取消。\n你需要在“设置”里点“忘记密码/重置密码”来重置。\n\n确定取消本次拉取吗？')) {
            return;
          }
          return;
        }
        if (!choice.pwd) { toast('已取消'); return; }
        setSyncPassword(choice.pwd);
        const test = await decryptForSync(data.encrypted, choice.pwd);
        if (!test) { toast('密码错误，拉取取消', 'error'); return; }
      }
    }
    const result = await applySyncPayload(data);
    state.settings.lastSyncAt = Date.now();
    saveSettings();
    render();
    const statusEl = document.getElementById('sync-status');
    if (statusEl) statusEl.textContent = `上次同步：${new Date().toLocaleString('zh-CN')}`;
    const decMsg = result.decrypted ? '（已恢复 API key 和练习进度）' : '';
    toast(`已从云端拉取 ${result.added} 个单词 ${decMsg}`, 'success');
  } catch (e) {
    console.error(e);
    toast('拉取失败：' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 从云端拉取'; }
  }
}

// Password prompt modal (returns the entered password, or null if cancelled)
function promptForPassword(message, defaultValue = '') {
  return new Promise((resolve) => {
    showModal(`
      <h2>输入同步密码</h2>
      <p>${escapeHtml(message)}</p>
      <div class="form-row">
        <input type="password" id="pw-prompt-input" value="${escapeHtml(defaultValue)}" autocomplete="off" style="font-size: 16px;">
      </div>
      <div class="flex-row" style="justify-content: flex-end; gap: 8px;">
        <button class="btn" id="pw-prompt-cancel">取消</button>
        <button class="btn btn-primary" id="pw-prompt-ok">确定</button>
      </div>
    `);
    setTimeout(() => document.getElementById('pw-prompt-input')?.focus(), 50);
    const finish = (val) => { closeModal(); resolve(val); };
    document.getElementById('pw-prompt-ok').addEventListener('click', () => {
      const v = (document.getElementById('pw-prompt-input').value || '').trim();
      if (!v) { toast('请输入密码', 'error'); return; }
      finish(v);
    });
    document.getElementById('pw-prompt-cancel').addEventListener('click', () => finish(null));
    document.getElementById('pw-prompt-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = (document.getElementById('pw-prompt-input').value || '').trim();
        if (v) finish(v);
      }
    });
  });
}

function renderClozeQuestion(w, c) {
  const sentence = c.clozeEnglish;
  const re = wordMatchRe(w.word);
  const m = sentence.match(re);
  const parts = [];
  if (m) {
    const idx = m.index;
    const before = sentence.slice(0, idx);
    const after = sentence.slice(idx + m[0].length);
    parts.push(renderMarkableText(before));
    parts.push(`<input type="text" class="blank-input" id="cloze-input" placeholder="填入单词" autocomplete="off" spellcheck="false">`);
    parts.push(renderMarkableText(after));
  } else {
    parts.push(renderMarkableText(sentence));
    parts.push(`<br><br><input type="text" class="blank-input" id="cloze-input" placeholder="填入单词" autocomplete="off" spellcheck="false">`);
  }

  // For cloze: Chinese meaning after feedback, or after user taps 提示
  const showMeaning = state.session && (state.session.phase === 'feedback' || state.session.hintShown);
  return `<div class="sentence-row">
            <div class="practice-sentence" id="practice-sentence">${parts.join('')}</div>
            <button type="button" class="speak-sentence-btn" data-speak-key="cloze" title="朗读整句">🔊</button>
          </div>
          <div class="mark-tip">点句子里不认识的词 → 加入生词表</div>
          <div id="cloze-hint-slot">
            ${showMeaning
              ? `<div class="chinese-sentence" id="cloze-meaning"><div class="text-light" style="font-size:12px; margin-bottom:4px;">整句意思</div>${escapeHtml(c.clozeChinese || '')}</div>`
              : `<div class="text-light" style="font-size:12px; margin-top: 4px; opacity: 0.5;">需要帮助？点「提示」看整句翻译</div>`}
          </div>`;
}

/** 常见词不标生词 */
const MARK_STOPWORDS = new Set([
  'a','an','the','and','or','but','if','as','at','by','for','from','in','into','of','on','onto','to','with','without',
  'is','am','are','was','were','be','been','being','do','does','did','done','have','has','had','having',
  'will','would','shall','should','can','could','may','might','must','need','dare',
  'i','me','my','mine','you','your','yours','he','him','his','she','her','hers','it','its','we','us','our','ours','they','them','their','theirs',
  'this','that','these','those','there','here','then','than','so','such','very','too','also','just','only','even','still',
  'not','no','nor','yes','all','any','each','every','both','few','more','most','other','some','such','own','same',
  'what','which','who','whom','whose','where','when','why','how',
  'about','above','after','again','against','along','among','around','before','behind','below','between','during','over','through','under','until','upon','within',
  'up','down','out','off','again','further','once','twice',
  'one','two','three','first','second','third'
]);

function isWordInList(word) {
  return !!findRelatedWordInList(word);
}

/** 把英文片段渲染成可点击生词 */
function renderMarkableText(text) {
  return String(text || '').replace(/[A-Za-z][A-Za-z'-]*/g, (match) => {
    const lower = match.toLowerCase();
    if (match.length < 3 || MARK_STOPWORDS.has(lower)) return escapeHtml(match);
    const related = findRelatedWordInList(lower);
    const inList = !!related;
    const tip = related
      ? (related.exact ? '已在词表' : `已有词形「${related.entry.word}」`)
      : '点击加入生词';
    return `<span class="markable-word${inList ? ' in-list' : ''}" data-word="${escapeHtml(lower)}" title="${escapeHtml(tip)}">${escapeHtml(match)}</span>`;
  });
}

async function addMarkedWord(rawWord) {
  const word = String(rawWord || '').toLowerCase().replace(/[^a-z'-]/g, '');
  if (!word || word.length < 3) return;
  if (MARK_STOPWORDS.has(word)) {
    toast('常见词，不用加入');
    return;
  }

  const related = findRelatedWordInList(word, { includeCrossed: true });
  if (related && !related.entry.crossedOut) {
    if (related.exact) {
      toast(`「${word}」已在词表`);
    } else {
      toast(`词表已有「${related.entry.word}」，「${word}」是词形变化，无需再加`);
    }
    highlightMarkedWord(word, false);
    return;
  }

  const existing = related?.exact ? related.entry : null;

  toast(`正在添加「${word}」…`);
  try {
    let translation = '';
    let phonetic = '';
    let partOfSpeech = '';
    let audioUrl = '';

    try {
      translation = await fetchYoudaoGloss(word);
    } catch (_) {}

    try {
      const resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (resp.ok) {
        const data = await resp.json();
        if (Array.isArray(data) && data[0]) {
          const best = pickBestPhonetic(data[0]);
          phonetic = normalizePhonetic(best?.text || '');
          partOfSpeech = data[0].meanings?.[0]?.partOfSpeech || '';
          audioUrl = best?.audio || data[0].phonetics?.find(p => p.audio)?.audio || '';
        }
      }
    } catch (_) {}

    if (!translation && isConfigured()) {
      try {
        const info = await generateWordInfo(word);
        translation = info.translation || translation;
        phonetic = phonetic || info.phonetic || '';
        partOfSpeech = partOfSpeech || info.partOfSpeech || '';
      } catch (_) {}
    }

    if (!translation) translation = '（待补充释义）';

    let saved;
    if (existing) {
      existing.crossedOut = false;
      existing.translation = translation;
      if (phonetic) existing.phonetic = phonetic;
      if (partOfSpeech) existing.partOfSpeech = partOfSpeech;
      if (audioUrl) existing.audioUrl = audioUrl;
      existing.nextReview = Date.now();
      await dbPut(existing);
      saved = existing;
    } else {
      saved = {
        id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8)),
        word,
        phonetic,
        partOfSpeech,
        translation,
        audioUrl,
        examples: [],
        addedAt: Date.now(),
        crossedOut: false,
        ease: 2.5,
        interval: 0,
        streak: 0,
        nextReview: Date.now(),
        lastReviewed: null,
        totalReviews: 0,
        correctReviews: 0
      };
      await dbPut(saved);
      state.words.push(saved);
    }

    highlightMarkedWord(word, true);
    toast(`已加入生词「${word}」`, 'success');
  } catch (e) {
    console.error(e);
    toast('添加失败：' + (e.message || 'unknown'), 'error');
  }
}

function highlightMarkedWord(word, justMarked) {
  const lower = String(word).toLowerCase();
  document.querySelectorAll('.markable-word').forEach(el => {
    if ((el.dataset.word || '').toLowerCase() !== lower) return;
    el.classList.add('in-list');
    el.title = '已在词表';
    if (justMarked) {
      el.classList.add('just-marked');
      setTimeout(() => el.classList.remove('just-marked'), 600);
    }
  });
}

  document.getElementById('back-today')?.addEventListener('click', () => {
    if (state.session?.phase === 'done') clearPracticeSession();
    else savePracticeSession();
    state.session = null;
    state.view = 'today';
    render();
  });

  document.getElementById('back-today-empty')?.addEventListener('click', () => {
    state.session = null;
    state.view = 'today';
    render();
  });

  // retry generate (must clear contentCache error, otherwise ensureContent replays the same failure)
  document.getElementById('retry-gen')?.addEventListener('click', () => {
    regenerateCurrent();
  });
  document.getElementById('skip-error-word')?.addEventListener('click', () => {
    skipCurrentWord();
  });

  const s = state.session;
  if (!s || !s.content) return;

  // input handling
  if (s.mode === 'cloze') {
    const input = document.getElementById('cloze-input');
    if (input) {
      input.focus();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (s.phase === 'feedback') nextQuestion();
          else checkCurrentAnswer();
        }
      });
    }
  } else if (s.mode === 'translate') {
    const input = document.getElementById('translate-input');
    if (input) {
      input.focus();
      // Enter inserts newline naturally in textarea; user clicks button
    }
  }

  // buttons
  document.getElementById('hint-btn')?.addEventListener('click', () => {
    const c = state.session?.content;
    if (!c) return;
    state.session.hintShown = true;
    showClozeSentenceMeaning(c);
    const hintBtn = document.getElementById('hint-btn');
    if (hintBtn) hintBtn.style.display = 'none';
  });
  document.getElementById('reveal-btn')?.addEventListener('click', revealAnswer);
  const checkBtn = document.getElementById('check-btn');
  if (checkBtn) {
    checkBtn.addEventListener('click', () => {
      if (s.phase === 'feedback') nextQuestion();
      else checkCurrentAnswer();
    });
  }

  document.querySelectorAll('[data-perf]').forEach(btn => {
    btn.addEventListener('click', () => rateAnswer(btn.dataset.perf));
  });

  document.getElementById('regen-content')?.addEventListener('click', regenerateCurrent);
  document.getElementById('skip-word')?.addEventListener('click', skipCurrentWord);

  // 完形填空：点击句子中的词加入生词
  document.getElementById('practice-sentence')?.addEventListener('click', (e) => {
    const el = e.target.closest('.markable-word');
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    addMarkedWord(el.dataset.word);
  });

  // Inline speak buttons in the practice card (美/英听筒 + 旧 inline)
  bindAccentSpeakButtons(document.getElementById('practice-card') || document);

  // Sentence-level speak (cloze English / translate reference)
  document.querySelectorAll('.speak-sentence-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const key = btn.dataset.speakKey;
      const c = state.session?.content;
      let text = '';
      if (key === 'cloze') text = c?.clozeEnglish || '';
      else if (key === 'translate-ref') text = c?.translateReference || '';
      if (!text) {
        toast('没有可朗读的句子');
        return;
      }
      btn.classList.add('speaking');
      setTimeout(() => btn.classList.remove('speaking'), 800);
      speakWord(text);
    });
  });
}

function revealAnswer() {
  const s = state.session;
  if (!s || !s.content) return;
  const w = s.words[s.wordIdx];
  const c = s.content;
  if (s.mode === 'cloze') {
    const expected = getClozeExpectedForm(w, c);
    const input = document.getElementById('cloze-input');
    if (input) {
      input.value = expected;
      input.readOnly = true;
    }
    showClozeSentenceMeaning(c);
    const hintBtn = document.getElementById('hint-btn');
    if (hintBtn) hintBtn.style.display = 'none';
    const fb = document.getElementById('feedback');
    if (fb) {
      fb.className = 'feedback-area show';
      const localGloss = getWordTranslation(w);
      fb.innerHTML = `<div class="label">已显示答案</div>本题答案是 <b>${escapeHtml(expected)}</b>${clozeAnswerPronHtml(w)}${clozeGlossHtml(w.word, localGloss)}${w.mnemonic ? mnemonicHtml(w.mnemonic) : (isConfigured() ? mnemonicHtml('', { loading: true }) : '')}`;
      bindAccentSpeakButtons(fb);
      fillClozeAnswerPron(fb, w);
      fillClozeGloss(fb, w);
    }
    showDifficultyRow();
  } else {
    const input = document.getElementById('translate-input');
    if (input) input.value = c.translateReference;
  }
  s.phase = 'feedback';
  document.getElementById('reveal-btn').style.display = 'none';
  const checkBtn = document.getElementById('check-btn');
  if (checkBtn) {
    checkBtn.style.display = 'inline-flex';
    checkBtn.textContent = '下一题 →';
  }
  savePracticeSession();
}

async function checkCurrentAnswer() {
  const s = state.session;
  if (!s || !s.content) return;
  const w = s.words[s.wordIdx];
  const c = s.content;
  const mode = s.mode;

  if (s.phase === 'feedback') {
    nextQuestion();
    return;
  }

  let userInput = '';
  if (mode === 'cloze') {
    userInput = document.getElementById('cloze-input')?.value?.trim() || '';
    if (!userInput) {
      toast('先填个答案 ~');
      return;
    }
  } else {
    userInput = document.getElementById('translate-input')?.value?.trim() || '';
    if (!userInput) {
      toast('先写一句英文 ~');
      return;
    }
  }

  setPracticeLoading(true);

  try {
    let result;
    if (mode === 'cloze') {
      result = await judgeCloze(w.word, userInput, c.clozeEnglish);
    } else {
      result = await judgeTranslation(w.word, c.translateChinese, c.translateReference, userInput);
    }
    s.lastResult = result;
    s.lastUserInput = userInput;
    showFeedback(result, mode, w, c);
    showDifficultyRow();

    document.getElementById('reveal-btn').style.display = 'none';
    const checkBtn = document.getElementById('check-btn');
    if (checkBtn) {
      checkBtn.style.display = 'inline-flex';
      checkBtn.textContent = '下一题 →';
    }
    s.phase = 'feedback';
  } catch (e) {
    console.error(e);
    toast('AI 评判失败：' + e.message, 'error');
  } finally {
    setPracticeLoading(false);
  }
  savePracticeSession();
}

function setPracticeLoading(loading) {
  const actions = document.getElementById('practice-actions');
  if (actions) {
    actions.style.opacity = loading ? '0.4' : '1';
    actions.style.pointerEvents = loading ? 'none' : 'auto';
  }
  let overlay = document.querySelector('.loading-overlay');
  if (loading && !overlay) {
    const card = document.getElementById('practice-card');
    if (card) {
      overlay = document.createElement('div');
      overlay.className = 'loading-overlay';
      overlay.innerHTML = '<div class="loading-text"><span class="spinner"></span> AI 评判中…</div>';
      card.appendChild(overlay);
    }
  } else if (!loading && overlay) {
    overlay.remove();
  }
}

/** 从完形句子中取出目标词的原始形态 */
function getClozeExpectedForm(w, c) {
  const sentence = c?.clozeEnglish || '';
  const re = wordMatchRe(w.word);
  const m = sentence.match(re);
  return m ? m[0] : w.word;
}

function clozeGlossHtml(wordLabel, gloss) {
  if (!gloss) {
    return `<div class="suggestion cloze-gloss" style="margin-top:8px;"><span class="text-light" style="font-size:12px;">词义加载中…</span></div>`;
  }
  // 把 ； ; ， 等拆开，方便复习多个义项
  const senses = String(gloss)
    .split(/[;；]/)
    .map(s => s.trim())
    .filter(Boolean);
  const body = senses.length > 1
    ? `<ul style="margin:6px 0 0; padding-left:18px; line-height:1.7;">${senses.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>`
    : `<div style="margin-top:4px; line-height:1.6;">${escapeHtml(gloss)}</div>`;
  return `<div class="suggestion cloze-gloss" style="margin-top:8px;">
    <div class="text-light" style="font-size:12px; margin-bottom:2px;">「${escapeHtml(wordLabel)}」词义复习</div>
    ${body}
  </div>`;
}

/** 完形填空揭晓答案时的音标 + 发音 */
function clozeAnswerPronHtml(w) {
  return `<div class="cloze-answer-pron" style="margin-top:10px;">
    <div class="text-light" style="font-size:12px; margin-bottom:4px;">读音复习 · 点喇叭听</div>
    <div class="word-phonetic">${renderPhoneticWithSpeakers(w)}</div>
  </div>`;
}

async function fillClozeAnswerPron(fb, w) {
  if (!fb || !w) return;
  try {
    await ensurePhonetic(w);
  } catch (_) {}
  const box = fb.querySelector('.cloze-answer-pron');
  const html = clozeAnswerPronHtml(w);
  if (box) box.outerHTML = html;
  else fb.insertAdjacentHTML('beforeend', html);
  bindAccentSpeakButtons(fb);
}

async function fillClozeGloss(fb, w) {
  if (!fb || !w) return;
  let gloss = getWordTranslation(w);
  try {
    const yd = await fetchYoudaoGloss(w.word);
    if (yd && (!gloss || yd.length > gloss.length || !hasValidTranslation(w))) {
      gloss = yd;
      if (!hasValidTranslation(w) || (w.translation && isSentenceLikeChinese(w.translation))) {
        w.translation = yd;
        dbPut(w).catch(() => {});
      } else if (yd.length > String(w.translation || '').length + 4) {
        // 有道释义更完整时更新
        w.translation = yd;
        dbPut(w).catch(() => {});
      }
    }
  } catch (_) {}

  if (!gloss && isConfigured()) {
    try {
      const info = await generateWordInfo(w.word);
      if (info?.translation) {
        gloss = info.translation;
        w.translation = info.translation;
        if (info.phonetic && !w.phonetic) w.phonetic = info.phonetic;
        if (info.mnemonic) w.mnemonic = info.mnemonic;
        dbPut(w).catch(() => {});
      }
    } catch (_) {}
  }

  const box = fb.querySelector('.cloze-gloss');
  const html = clozeGlossHtml(w.word, gloss || '暂无更多释义');
  if (box) box.outerHTML = html;
  else fb.insertAdjacentHTML('beforeend', html);
  fillClozeMnemonic(fb, w);
}

async function fillClozeMnemonic(fb, w) {
  if (!fb || !w) return;
  let tip = String(w.mnemonic || '').trim();
  const existing = fb.querySelector('.cloze-mnemonic');
  if (!tip && isConfigured()) {
    if (!existing) fb.insertAdjacentHTML('beforeend', mnemonicHtml('', { loading: true }));
    tip = await ensureMnemonic(w);
  }
  const html = mnemonicHtml(tip);
  const box = fb.querySelector('.cloze-mnemonic');
  if (!html) {
    if (box) box.remove();
    return;
  }
  if (box) box.outerHTML = html;
  else fb.insertAdjacentHTML('beforeend', html);
}

function showFeedback(result, mode, w, c) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback-area show';

  if (mode === 'cloze') {
    showClozeSentenceMeaning(c);
    const hintBtn = document.getElementById('hint-btn');
    if (hintBtn) hintBtn.style.display = 'none';
    const expected = getClozeExpectedForm(w, c);
    const input = document.getElementById('cloze-input');
    if (input) {
      input.value = expected;
      input.readOnly = true;
    }
    const localGloss = getWordTranslation(w);
    const coach = clozeCoachHtml(result);
    const memoSlot = w.mnemonic ? mnemonicHtml(w.mnemonic) : (isConfigured() ? mnemonicHtml('', { loading: true }) : '');
    if (result.correct) {
      fb.classList.add('correct');
      fb.innerHTML = `<div class="label">✓ 答对了</div>本题答案是 <b>${escapeHtml(expected)}</b>${clozeAnswerPronHtml(w)}<br>${escapeHtml(result.feedback || '很好！')}${coach}${clozeGlossHtml(w.word, localGloss)}${memoSlot}`;
    } else {
      fb.classList.add('wrong');
      fb.innerHTML = `<div class="label">✗ 答错了</div>正确答案是 <b>${escapeHtml(expected)}</b>${clozeAnswerPronHtml(w)}<br>${escapeHtml(result.feedback || '')}${coach}${clozeGlossHtml(w.word, localGloss)}${memoSlot}`;
    }
    bindAccentSpeakButtons(fb);
    fillClozeAnswerPron(fb, w);
    fillClozeGloss(fb, w);
  } else {
    const score = result.score || 0;
    const ref = result.improvedVersion || c.translateReference || '';
    const speakBtn = ref
      ? ` <button type="button" class="speak-sentence-btn" data-speak-key="translate-ref" title="朗读参考译文" style="vertical-align:middle;">🔊</button>`
      : '';
    if (score >= 75) {
      fb.classList.add('correct');
      fb.innerHTML = `<div class="label">✓ 不错 (${score}分)</div>${escapeHtml(result.feedback || '')}${ref ? `<div class="suggestion">参考改进：${speakBtn}<br>${escapeHtml(ref)}</div>` : ''}`;
    } else if (score >= 60) {
      fb.classList.add('partial');
      fb.innerHTML = `<div class="label">⚠ 还需要改进 (${score}分)</div>${escapeHtml(result.feedback || '')}${ref ? `<div class="suggestion">参考：${speakBtn}<br>${escapeHtml(ref)}</div>` : ''}`;
    } else {
      fb.classList.add('wrong');
      fb.innerHTML = `<div class="label">✗ 需要重新理解 (${score}分)</div>${escapeHtml(result.feedback || '')}<div class="suggestion">参考：${speakBtn}<br>${escapeHtml(ref)}</div>`;
    }
    fb.querySelectorAll('.speak-sentence-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const text = state.session?.content?.translateReference || result.improvedVersion || '';
        if (!text) return;
        btn.classList.add('speaking');
        setTimeout(() => btn.classList.remove('speaking'), 800);
        speakWord(text);
      });
    });
  }
}

function showDifficultyRow() {
  const row = document.getElementById('difficulty-row');
  if (row) row.style.display = 'flex';
}

async function rateAnswer(perf) {
  const s = state.session;
  if (!s) return;
  const w = s.words[s.wordIdx];
  const result = s.lastResult || {};
  const isCorrect = result.correct === true;

  // Only update spaced repetition once per word in this session
  {
    const updated = {
      ...w,
      ...updateSchedule(w, perf),
      totalReviews: (w.totalReviews || 0) + 1,
      correctReviews: (w.correctReviews || 0) + (isCorrect ? 1 : 0)
    };
    await dbPut(updated);
    Object.assign(w, updated);
  }

  s.results.push({ wordId: w.id, mode: s.mode, correct: isCorrect, perf });
  if (isCorrect) {
    s.streak = (s.streak || 0) + 1;
    s.bestStreak = Math.max(s.bestStreak || 0, s.streak);
  } else {
    s.streak = 0;
  }

  nextQuestion();
}

function nextQuestion() {
  const s = state.session;
  if (!s) return;

  // Single-mode session: always advance to next word
  s.wordIdx += 1;
  s.content = null;
  s.lastResult = null;
  s.lastUserInput = null;
  s.hintShown = false;

  if (s.wordIdx >= s.words.length) {
    finishSession();
    return;
  }

  // 有缓存就秒开；没有再转圈等待，同时继续后台补题
  const cached = s.contentCache[s.words[s.wordIdx].id];
  if (cached?.content) {
    s.content = cached.content;
    s.phase = 'answer';
    savePracticeSession();
    render();
    kickPrefetch(s);
    return;
  }

  s.phase = 'generating';
  savePracticeSession();
  render();
  ensureContent();
}

async function ensureContent() {
  const s = state.session;
  if (!s) return;
  const w = s.words[s.wordIdx];
  if (!w) return;

  const hit = s.contentCache[w.id];
  if (hit?.content) {
    s.content = hit.content;
    s.phase = 'answer';
    savePracticeSession();
    render();
    kickPrefetch(s);
    return;
  }
  if (hit?.error) {
    s.phase = 'error';
    s.error = hit.error;
    savePracticeSession();
    render();
    kickPrefetch(s);
    return;
  }

  s.phase = 'generating';
  render();

  try {
    const entry = await waitForWordContent(s, w);
    if (!sessionAlive(s) || s.wordIdx >= s.words.length || s.words[s.wordIdx]?.id !== w.id) return;
    if (entry?.content) {
      s.content = entry.content;
      s.phase = 'answer';
    } else {
      s.phase = 'error';
      s.error = entry?.error || '生成失败';
    }
  } catch (e) {
    console.error(e);
    if (!sessionAlive(s)) return;
    s.phase = 'error';
    s.error = e.message;
  }
  savePracticeSession();
  render();
  kickPrefetch(s);
}

async function regenerateCurrent() {
  const s = state.session;
  if (!s) return;
  const w = s.words[s.wordIdx];
  if (!w) return;
  delete s.contentCache[w.id];
  delete s._inflight[w.id];
  s.content = null;
  s.error = null;
  s.lastResult = null;
  s.lastUserInput = null;
  s.hintShown = false;
  s.phase = 'generating';
  render();
  try {
    const content = await generateContentForWord(w, s.mode);
    if (!sessionAlive(s) || s.words[s.wordIdx]?.id !== w.id) return;
    s.contentCache[w.id] = { content };
    s.content = content;
    s.phase = 'answer';
  } catch (e) {
    if (!sessionAlive(s)) return;
    // Even on unexpected errors, fall back to a template sentence
    try {
      const content = fallbackContentForWord(w, s.mode);
      s.contentCache[w.id] = { content };
      s.content = content;
      s.phase = 'answer';
      toast('已使用备用题目', 'success');
    } catch (_) {
      s.contentCache[w.id] = { error: e.message };
      s.phase = 'error';
      s.error = e.message;
    }
  }
  render();
  kickPrefetch(s);
  savePracticeSession();
}

function skipCurrentWord() {
  const s = state.session;
  if (!s) return;
  s.results.push({
    wordId: s.words[s.wordIdx].id,
    mode: s.mode,
    correct: false,
    perf: 'hard',
    skipped: true
  });
  nextQuestion();
}

function finishSession() {
  // update streak
  const today = new Date().toDateString();
  const lastDay = localStorage.getItem(lsKey('last-day'));
  let streak = parseInt(localStorage.getItem(lsKey('streak')) || '0');
  if (lastDay !== today) {
    const yesterday = new Date(Date.now() - DAY_MS).toDateString();
    if (lastDay === yesterday || !lastDay) {
      streak = lastDay ? streak + 1 : 1;
    } else {
      streak = 1;
    }
    localStorage.setItem(lsKey('streak'), streak);
    localStorage.setItem(lsKey('last-day'), today);
  }
  localStorage.setItem(lsKey('done-' + today), '1');

  state.session.phase = 'done';
  clearPracticeSession();
  render();
  // Auto-sync to cloud after practice session
  scheduleAutoSync();
}

function renderSessionDone() {
  const s = state.session || { results: [], bestStreak: 0, words: [] };
  const correct = s.results.filter(r => r.correct).length;
  const total = s.results.length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const encouragement = pct >= 90 ? '太牛了！' : pct >= 75 ? '不错！' : pct >= 60 ? '加油！' : '继续努力！';

  return `
    <div class="app-header">
      <h1>${encouragement}</h1>
      <p>本次${s.mode === 'translate' ? '句子翻译' : '完形填空'}完成</p>
    </div>

    <div class="today-card" style="text-align: center;">
      <h2>本次成绩</h2>
      <div style="font-size: 48px; font-family: Georgia, serif; font-weight: 600; margin: 12px 0 4px;">${pct}%</div>
      <div style="opacity: 0.85; font-size: 14px;">${correct} / ${total} 答对 · 最长连击 ${s.bestStreak || 0}</div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 12px; font-size: 14px;">本轮详情</h3>
      ${s.results.length === 0 ? '<p class="text-light">没答几道题呢~</p>' : s.results.map(r => {
        const w = state.words.find(x => x.id === r.wordId);
        if (!w) return '';
        const modeLabel = r.mode === 'cloze' ? '完形填空' : '句子翻译';
        const perfLabel = r.skipped ? '跳过' : (r.perf === 'wrong' ? '不认识' : r.perf === 'hard' ? '模糊' : r.perf === 'good' ? '认识' : '很熟');
        return `<div class="word-list-item">
          <div class="word">${escapeHtml(w.word)}</div>
          <div class="meta">
            <div><span class="tag ${r.correct ? 'tag-mastered' : 'tag-due'}">${r.correct ? '✓ 答对' : '✗ 答错'}</span> <span class="text-light">${modeLabel} · ${perfLabel}</span></div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <button class="btn btn-primary btn-lg btn-block" id="back-today">回到主页</button>
    <button class="btn btn-block mt-2" id="practice-again">再来一轮</button>
  `;
}

async function startPractice(customWords, mode = 'cloze') {
  const words = Array.isArray(customWords) ? customWords : selectDailyWords();
  if (words.length === 0) {
    toast('没有可练习的单词，去「添加」加几个吧', 'error');
    return;
  }
  if (mode !== 'cloze' && mode !== 'translate') mode = 'cloze';

  // Shuffle the words
  const shuffled = [...words].sort(() => Math.random() - 0.5);

  const s = {
    words: shuffled,
    wordIdx: 0,
    mode,                 // fixed for the whole session: 'cloze' | 'translate'
    content: null,
    contentCache: {},     // wordId -> { content } | { error }
    _inflight: {},
    _prefetchRunning: false,
    phase: 'generating',
    results: [],
    streak: 0,
    bestStreak: 0,
    lastResult: null,
    lastUserInput: null,
    hintShown: false
  };
  state.session = s;
  state.view = 'practice';
  clearPracticeSession(); // 新开一轮，先清旧进度，出题后再写入
  render();

  // 先出 1–2 题，等第一题就绪即可开始；其余后台批量补齐
  const initial = shuffled.slice(0, Math.min(PREFETCH_INITIAL, shuffled.length));
  try {
    await prefetchWords(s, initial);
  } catch (e) {
    console.warn('initial prefetch', e);
  }
  if (!sessionAlive(s)) return;
  await ensureContent();
  kickPrefetch(s);
  savePracticeSession();
}

    item.addEventListener('click', () => {
      // 离开练习页时记住进度
      if (item.dataset.view !== 'practice' && state.view === 'practice') {
        savePracticeSession();
        state.session = null;
      }
      switchView(item.dataset.view);
    });
  });

  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });

  window.addEventListener('beforeunload', () => {
    if (state.session && state.session.phase !== 'done') savePracticeSession();
  });

  render();
}

init();
</script>
</body>
</html>
